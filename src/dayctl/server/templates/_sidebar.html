<aside class="side">
  <div class="brand">
    <div class="brand-mark">G</div>
    <div>
      <div class="brand-name">Daily OS</div>
      <div class="brand-sub">GK · v3.20</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label"><span>Today</span></div>
    <div class="nav-item active">
      <span class="dot"></span>
      <span>Dashboard</span>
      <span class="badge">•</span>
    </div>
    <div class="nav-item">
      <span class="dot"></span>
      <span>Schedule</span>
      <span class="badge">5</span>
    </div>
    <div class="nav-item">
      <span class="dot"></span>
      <span>Inbox</span>
      <span class="badge">12</span>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">
      <span>Craft</span>
      <span class="count">FLOW</span>
    </div>
    <div class="nav-item">
      <span class="dot" style="background: #f472b6"></span>
      <span>Music Studio</span>
      <span class="badge">3</span>
    </div>
    <div class="nav-item">
      <span class="dot" style="background: #ef4444"></span>
      <span>YouTube</span>
      <span class="badge">4</span>
    </div>
    <div class="nav-item">
      <span class="dot" style="background: #7dd3fc"></span>
      <span>Programming</span>
      <span class="badge">2</span>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label"><span>Growth</span></div>
    <div class="nav-item">
      <span class="dot" style="background: #facc15"></span>
      <span>Marketing</span>
      <span class="badge">2</span>
    </div>
    <div class="nav-item">
      <span class="dot" style="background: #c4a7f7"></span>
      <span>Social Media</span>
      <span class="badge">6</span>
    </div>
    <div class="nav-item">
      <span class="dot" style="background: #4ade80"></span>
      <span>Analytics</span>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label"><span>System</span></div>
    <div class="nav-item">
      <span class="dot"></span>
      <span>Library</span>
    </div>
    <div class="nav-item">
      <span class="dot"></span>
      <span>Weekly Review</span>
    </div>
    <div class="nav-item">
      <span class="dot"></span>
      <span>Settings</span>
    </div>
  </div>

  <div class="side-foot">
    <div class="streak">
      <div class="streak-row">
        <div class="streak-num">{{ streak }}</div>
        <div class="streak-label">day streak</div>
      </div>
      <div class="streak-dots">{% for w in week %}<span class="{% if w.score == w.total %}on{% elif w.score %}half{% endif %}"></span>{% endfor %}</div>
      <div style="margin-top: 10px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-mute); letter-spacing: 0.08em; text-transform: uppercase;">
        Today · {{ score }}/{{ total }}
      </div>
    </div>
  </div>
</aside>
